[package]
name = "aura-launcher-core"
version = "0.1.0"
edition = "2021"
authors = ["AURA OS Engineering Team"]
description = "AURA OS Core Platform Engine and Environment Detection Library"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sysinfo = "0.30"
tokio = { version = "1.38", features = ["full"] }
