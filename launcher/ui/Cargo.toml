[package]
name = "aura-cli"
version = "0.1.0"
edition = "2021"
authors = ["AURA OS Engineering Team"]
description = "AURA OS Desktop Launcher & CLI Platform Diagnostic Engine"

[[bin]]
name = "aura-cli"
path = "src/main.rs"

[[bin]]
name = "aura-gui"
path = "src/gui_main.rs"

[dependencies]
aura-launcher-core = { path = "../core" }
aura-vm-manager = { path = "../../runtime/vm-manager" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
eframe = "0.27"
egui = "0.27"
image = "0.24"
rfd = "0.14"
