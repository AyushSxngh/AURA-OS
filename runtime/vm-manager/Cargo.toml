[package]
name = "aura-vm-manager"
version = "0.1.0"
edition = "2021"
authors = ["AURA OS Engineering Team"]
description = "AURA OS Virtual Machine & ADB Process Lifecycle Controller"

[dependencies]
aura-launcher-core = { path = "../../launcher/core" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
